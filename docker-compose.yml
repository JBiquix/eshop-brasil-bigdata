version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mongodb_eshop
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  streamlit:
    build: .
    container_name: streamlit_eshop
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      - mongo
    volumes:
      - .:/app

volumes:
  mongo_data:
